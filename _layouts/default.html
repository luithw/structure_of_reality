<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ site.description }}">
    <meta name="author" content="{{ site.author }}">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    
    <!-- Open Graph for social media -->
    <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
    <meta property="og:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
    <meta property="og:type" content="{% if page.date %}article{% else %}website{% endif %}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
    <meta name="twitter:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
    
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
    <header class="site-header">
        <div class="wrapper header-wrapper">
            <div class="header-left">
                <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
                <p class="site-subtitle">{{ site.description }}</p>
                <nav class="site-nav">
                    <a href="{{ '/' | relative_url }}">Home</a>
                    <a href="{{ '/about/' | relative_url }}">About</a>
                    <a href="{{ '/archive/' | relative_url }}">Archive</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="page-content">
        <div class="wrapper">
            {{ content }}
        </div>
    </main>

    <footer class="site-footer">
        <div class="wrapper">
            <!-- Newsletter Subscription -->
            <div class="newsletter-section">
                <h3>📬 Subscribe to Newsletter</h3>
                <p>Get notified when I publish new articles. No spam, unsubscribe anytime.</p>
                <form class="newsletter-form" id="newsletter-form">
                    <input type="email" id="newsletter-email" name="email" placeholder="Enter your email" required>
                    <button type="submit">Subscribe</button>
                </form>
                <div id="newsletter-message" style="display: none; margin-top: 10px; padding: 10px; border-radius: 4px;"></div>
            </div>
            
            <script>
            (function() {
                const form = document.getElementById('newsletter-form');
                const emailInput = document.getElementById('newsletter-email');
                const messageEl = document.getElementById('newsletter-message');
                
                if (!form) return;
                
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    
                    const email = emailInput.value.trim();
                    if (!email) {
                        showMessage('Please enter an email address', 'error');
                        return;
                    }
                    
                    // Calculate API base URL from current page path (supports Tayis subpath)
                    const pathParts = window.location.pathname.split('/').filter(p => p);
                    let apiBase = '';
                    
                    if (pathParts.length >= 4 && pathParts[0] === 'u' && pathParts[2] === 'p') {
                        apiBase = '/' + pathParts.slice(0, 4).join('/');
                    } else {
                        apiBase = '';
                    }
                    
                    const button = form.querySelector('button');
                    button.disabled = true;
                    button.textContent = 'Subscribing...';
                    
                    fetch(apiBase + '/api/newsletter/subscribe', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: email })
                    })
                        .then(r => r.json())
                        .then(data => {
                            if (data.error) {
                                showMessage(data.error, 'error');
                            } else {
                                showMessage('✅ ' + data.message, 'success');
                                emailInput.value = '';
                            }
                            button.disabled = false;
                            button.textContent = 'Subscribe';
                        })
                        .catch(err => {
                            console.error('Error subscribing:', err);
                            showMessage('Something went wrong. Please try again.', 'error');
                            button.disabled = false;
                            button.textContent = 'Subscribe';
                        });
                });
                
                function showMessage(text, type) {
                    messageEl.textContent = text;
                    messageEl.className = 'newsletter-' + type;
                    messageEl.style.display = 'block';
                    
                    if (type === 'success') {
                        setTimeout(() => {
                            messageEl.style.display = 'none';
                        }, 5000);
                    }
                }
            })();
            </script>
            
            <div class="footer-main">
                <p>{{ site.description }}</p>
                <p class="copyright">&copy; {{ 'now' | date: "%Y" }} {{ site.author }}. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- Local Timezone Conversion -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('.local-time').forEach(function(timeEl) {
                const datetime = timeEl.getAttribute('datetime');
                if (datetime) {
                    const date = new Date(datetime);
                    const options = {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric',
                        hour: 'numeric',
                        minute: '2-digit',
                        hour12: true
                    };
                    timeEl.textContent = date.toLocaleString(undefined, options);
                }
            });
        });
    </script>
</body>
</html>
